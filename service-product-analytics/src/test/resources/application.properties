spring.application.name=product-analytics
spring.web.mvc.servlet.path=/api
server.port=0

# Allow bean definition overriding in tests
spring.main.allow-bean-definition-overriding=true

# H2 in-memory database for tests (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop

# ClickHouse - use test configuration (will be mocked)
clickhouse.url=jdbc:clickhouse://localhost:8123/default
clickhouse.username=default
clickhouse.password=

# Spring Cloud Stream - use test binder
spring.cloud.stream.default.group=product-analytics-test-group
spring.cloud.function.definition=onQuotationUpdated
spring.cloud.stream.bindings.onQuotationUpdated-in-0.destination=pricing-quotation-updated.v1

# Quotation Agent Service Configuration
services.quotation-agent.url=http://localhost:8085
