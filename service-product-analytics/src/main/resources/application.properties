spring.application.name=ProductAnalytics
spring.web.mvc.servlet.path=/api
server.port=8084
spring.datasource.url=jdbc:postgresql://localhost:5434/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

# https://docs.spring.io/spring-cloud-stream/reference/spring-cloud-stream/binding-properties.html
spring.cloud.stream.default.group=product-analytics-group
spring.cloud.function.definition=onQuotationSubmitted
spring.cloud.stream.bindings.onQuotationSubmitted-in-0.destination=pricing-quotation-submitted.v1
