spring.application.name=ProductViewer
spring.web.mvc.servlet.path=/api
spring.datasource.url=jdbc:postgresql://localhost:5432/pricing
spring.datasource.username=dbuser
spring.datasource.password=dbpassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.session.store-type=redis
spring.redis.host=localhost
spring.redis.port=6379
spring.security.oauth2.client.registration.keycloak.client-id=product-viewer-client
spring.security.oauth2.client.registration.keycloak.client-secret=product-viewer-secret
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/keycloak
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:81/realms/pricing
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:81/realms/pricing
