spring.application.name=product-analytics
spring.web.mvc.servlet.path=/api
server.port=8084

# API Versioning Configuration
spring.web.mvc.version.strategy=header
spring.web.mvc.version.param-name=X-API-Version

# PostgreSQL - for idempotency tracking only
spring.datasource.url=jdbc:postgresql://localhost:5434/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

# ClickHouse - for analytics data
clickhouse.url=jdbc:clickhouse://localhost:8123/default
clickhouse.username=default
clickhouse.password=
clickhouse.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver

# OAuth2 Security Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/pricing

# https://docs.spring.io/spring-cloud-stream/reference/spring-cloud-stream/binding-properties.html
spring.cloud.stream.default.group=product-analytics-group
spring.cloud.function.definition=onQuotationValidated
spring.cloud.stream.bindings.onQuotationValidated-in-0.destination=pricing-quotation-validated.v1
